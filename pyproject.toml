[project]
name = "asian-asteroid-destroyers"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "deap>=1.4.4",
    "joblib>=1.6.0",
    "kesslergame>=2.4.0",
    "matplotlib==3.10.9",
    "networkx>=3.4.2",
    "numpy==2.2.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "polars>=2.0.0",
    "scikit-fuzzy>=0.5.0",
    "scipy>=1.15.3",
    "typing-extensions>=4.16.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
src-layout = true

[tool.uv]
package = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
